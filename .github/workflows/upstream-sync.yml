# Added in the vmalyshev1/opentaxrate fork (not part of upstream OpenTaxRate).
#
# Weekly upstream sync with a safety check.
#
#   1. Fetches equated-org/opentaxrate (upstream) main.
#   2. If it has commits this fork's main lacks, merges them into the
#      `upstream-sync` branch (never directly into main).
#      A conflict confined to pnpm-lock.yaml (expected, because this fork
#      pins newer dependency versions) is resolved by taking upstream's
#      lockfile and regenerating it from the merged package.json.
#   3. Runs the type check, the test suite and a production dependency audit.
#   4. Opens (or updates) a pull request into main with the results.
#      Nothing reaches main until a human merges the PR.
#   5. Any other merge conflict opens an issue instead of a PR.
#
# Checks run inside this job because pull requests opened with GITHUB_TOKEN
# do not trigger other workflows.
#
# One-time repository settings required:
#   - Actions tab: enable workflows for this fork.
#   - Settings > Actions > General > Workflow permissions:
#     tick "Allow GitHub Actions to create and approve pull requests".

name: Upstream sync

on:
  schedule:
    # Mondays 06:23 UTC (off the hour to avoid scheduler congestion).
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/equated-org/opentaxrate.git
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    name: Merge upstream, check, open PR
    if: github.repository == 'vmalyshev1/opentaxrate'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out this fork's main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch upstream and count new commits
        id: check
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          behind=$(git rev-list --count "HEAD..upstream/$UPSTREAM_BRANCH")
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short "upstream/$UPSTREAM_BRANCH")" >> "$GITHUB_OUTPUT"
          echo "Fork main is $behind commit(s) behind upstream."

      - name: Merge upstream into the sync branch
        id: merge
        if: steps.check.outputs.behind != '0'
        run: |
          git checkout -B "$SYNC_BRANCH"
          msg="Merge upstream ${UPSTREAM_BRANCH} (${{ steps.check.outputs.upstream_sha }})"
          if git merge --no-edit --no-ff "upstream/$UPSTREAM_BRANCH" -m "$msg"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --diff-filter=U > /tmp/conflicts.txt
          if [ "$(cat /tmp/conflicts.txt)" = "pnpm-lock.yaml" ]; then
            # Only the lockfile conflicts: take upstream's and regenerate it
            # against the merged package.json (which keeps this fork's pins).
            git checkout --theirs pnpm-lock.yaml
            pnpm install --lockfile-only --ignore-scripts
            git add pnpm-lock.yaml
            git commit --no-edit -m "$msg (lockfile regenerated)"
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report merge conflict as an issue
        if: steps.merge.outputs.conflict == 'true'
        run: |
          title="Upstream sync: merge conflict (upstream ${{ steps.check.outputs.upstream_sha }})"
          {
            echo "Upstream has ${{ steps.check.outputs.behind }} new commit(s), but they conflict with this fork's changes."
            echo
            echo "Conflicting files:"
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "Resolve by merging \`upstream/main\` into a branch by hand. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > /tmp/issue.md
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title Upstream sync: merge conflict" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GITHUB_REPOSITORY" "$existing" --body-file /tmp/issue.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file /tmp/issue.md
          fi

      - name: Install dependencies
        if: steps.merge.outputs.conflict == 'false'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        id: typecheck
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: pnpm typecheck 2>&1 | tee /tmp/typecheck.log; exit "${PIPESTATUS[0]}"

      - name: Tests
        id: tests
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: pnpm test 2>&1 | tee /tmp/test.log; exit "${PIPESTATUS[0]}"

      - name: Production dependency audit
        id: audit
        if: steps.merge.outputs.conflict == 'false'
        continue-on-error: true
        run: pnpm audit --prod 2>&1 | tee /tmp/audit.log; exit "${PIPESTATUS[0]}"

      - name: Push sync branch and open or update the pull request
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push --force origin "$SYNC_BRANCH"

          word() { if [ "$1" = "success" ]; then echo "PASSED"; else echo "FAILED"; fi; }
          tc=$(word "${{ steps.typecheck.outcome }}")
          ts=$(word "${{ steps.tests.outcome }}")
          au=$(word "${{ steps.audit.outcome }}")
          strip() { sed 's/\x1b\[[0-9;]*m//g'; }

          {
            echo "Automated weekly sync from [equated-org/opentaxrate](https://github.com/equated-org/opentaxrate)."
            echo
            echo "- New upstream commits: **${{ steps.check.outputs.behind }}** (upstream main at \`${{ steps.check.outputs.upstream_sha }}\`)"
            echo "- Type check: **$tc**"
            echo "- Tests: **$ts**"
            echo "- Production dependency audit: **$au**"
            echo
            echo "Tests summary:"
            echo '```'
            grep -E "Test Files|Tests " /tmp/test.log | strip || true
            echo '```'
            echo "Audit summary:"
            echo '```'
            tail -n 3 /tmp/audit.log | strip || true
            echo '```'
            echo
            echo "Upstream changes: ${{ github.server_url }}/${{ github.repository }}/compare/main...${SYNC_BRANCH}"
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Merging this PR updates this fork's main only. The US-Sales-Tax-Calc app keeps its pinned version until it is bumped deliberately."
          } > /tmp/pr.md

          title="Upstream sync: ${{ steps.check.outputs.behind }} new commit(s), typecheck $tc, tests $ts"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit --repo "$GITHUB_REPOSITORY" "$existing" --title "$title" --body-file /tmp/pr.md
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base main --title "$title" --body-file /tmp/pr.md
          fi

      - name: Nothing to do
        if: steps.check.outputs.behind == '0'
        run: echo "Fork main already contains everything from upstream."
